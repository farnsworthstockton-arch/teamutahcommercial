<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links | Team Utah Commercial | REMAX Associates</title>
    <meta name="description" content="Team Utah Commercial — Utah commercial real estate. Our listings, blog, free classes and how to reach us, all in one place.">
    <link rel="canonical" href="https://teamutahcommercial.com/links">
    <meta property="og:title" content="Team Utah Commercial | Links">
    <meta property="og:description" content="Our listings, blog, free classes and how to reach us.">
    <meta property="og:url" content="https://teamutahcommercial.com/links">
    <meta property="og:type" content="website">
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;800&display=swap" rel="stylesheet">
    <!--
      The link-in-bio page for the Instagram bio (2026-10-28 team meeting: our own
      page instead of Linktree, so we own it and see the clicks). The buttons come
      from links.json, which Sarah edits in the Studio (/studio/links on the approval
      deck); the list below in FALLBACK is only used if links.json can't be loaded.
    -->
    <style>
        :root {
            --navy: #062B6E; --blue: #003DA5; --red: #DC1C2E; --ink: #10233F;
            --muted: #5B6B7D; --line: #E4E9F0; --bg: #F5F7FA; --card: #FFFFFF;
        }
        * { box-sizing: border-box; }
        html, body { margin: 0; }
        body {
            font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--ink); min-height: 100vh;
        }
        .top { background: var(--navy); color: #fff; padding: 28px 16px 26px; border-radius: 0 0 28px 28px; }
        .top .inner { max-width: 520px; margin: 0 auto; }
        .wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
        .logos {
            background: #fff; border-radius: 18px; padding: 14px 18px; display: flex;
            align-items: center; justify-content: center; gap: 18px;
            box-shadow: 0 10px 30px rgba(6, 43, 110, .18);
        }
        .logos img { height: 52px; width: auto; display: block; }
        .logos .sep { width: 1px; align-self: stretch; background: var(--line); }
        h1 { font-size: 1.35rem; font-weight: 800; margin: 20px 0 4px; text-align: center; color: #fff; }
        .tagline { text-align: center; color: rgba(255,255,255,.82); margin: 0; font-size: .95rem; }
        .links { display: grid; gap: 12px; }
        .link {
            display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--ink);
            background: var(--card); border: 1px solid var(--line); border-radius: 16px;
            padding: 15px 18px; min-height: 64px; transition: transform .12s, box-shadow .12s, border-color .12s;
        }
        .link:hover, .link:focus-visible { transform: translateY(-2px); border-color: var(--blue);
            box-shadow: 0 8px 22px rgba(0, 61, 165, .14); outline: none; }
        .link .dot { flex: 0 0 10px; height: 10px; border-radius: 50%; background: var(--red); }
        .link .txt { flex: 1; min-width: 0; }
        .link .t { display: block; font-weight: 600; font-size: 1.02rem; line-height: 1.3; }
        .link .n { display: block; color: var(--muted); font-size: .85rem; margin-top: 2px; }
        .link .arrow { color: var(--blue); font-weight: 800; }
        .link.featured { background: var(--red); border-color: var(--red); color: #fff; }
        .link.featured .n { color: rgba(255,255,255,.85); }
        .link.featured .dot { background: #fff; }
        .link.featured .arrow { color: #fff; }
        footer { margin-top: 30px; text-align: center; color: var(--muted); font-size: .78rem; line-height: 1.6; }
        footer a { color: var(--muted); }
    </style>
</head>
<body>
    <header class="top"><div class="inner">
        <div class="logos">
            <img src="logos/team-utah-commercial-white.png" alt="Team Utah Commercial" style="background:var(--navy);padding:6px 10px;border-radius:8px;">
            <span class="sep" aria-hidden="true"></span>
            <img src="logos/remax-commercial-navy-small.jpg" alt="REMAX Commercial Associates">
        </div>
        <h1 id="headline">Team Utah Commercial</h1>
        <p class="tagline" id="tagline">No one markets commercial property the way we do.</p>
    </div></header>
    <main class="wrap">
        <nav class="links" id="links" aria-label="Links">
            <noscript>
                <a class="link" href="/"><span class="dot"></span><span class="txt"><span class="t">Our listings</span></span><span class="arrow">&rarr;</span></a>
                <a class="link" href="/blog.html"><span class="dot"></span><span class="txt"><span class="t">Blog</span></span><span class="arrow">&rarr;</span></a>
                <a class="link" href="tel:8015664411"><span class="dot"></span><span class="txt"><span class="t">Call us: 801-566-4411</span></span><span class="arrow">&rarr;</span></a>
            </noscript>
        </nav>
        <footer>
            Team Utah Commercial | REMAX Associates<br>
            6955 S Union Park Center #140, Cottonwood Heights, UT 84047<br>
            Each Office Independently Owned and Operated.
        </footer>
    </main>
    <script>
    (function () {
        var FALLBACK = {
            links: [
                { title: "See our listings", note: "Every property we have for sale or lease", url: "/", on: true, featured: true },
                { title: "Property map", url: "/map.html", on: true },
                { title: "Blog: Utah commercial real estate news", url: "/blog.html", on: true },
                { title: "Free class: Commercial Mentoring", note: "Save your seat", url: "/rsvp", on: true },
                { title: "What's my building worth?", note: "Free broker opinion of value", url: "https://utahbuildingvalue.com/", on: true },
                { title: "Call us: 801-566-4411", url: "tel:8015664411", on: true }
            ]
        };
        var SAFE = /^(https?:\/\/|\/|tel:|mailto:)/i;
        function el(tag, cls, text) {
            var e = document.createElement(tag);
            if (cls) e.className = cls;
            if (text) e.textContent = text;
            return e;
        }
        function render(doc) {
            var box = document.getElementById("links");
            if (doc.headline) document.getElementById("headline").textContent = doc.headline;
            if (doc.tagline) document.getElementById("tagline").textContent = doc.tagline;
            box.textContent = "";
            (doc.links || []).forEach(function (l) {
                if (!l || l.on === false || !l.title || !SAFE.test(String(l.url || ""))) return;
                var a = el("a", "link" + (l.featured ? " featured" : ""));
                a.href = l.url;
                if (/^https?:\/\//i.test(l.url) && l.url.indexOf(location.host) === -1) {
                    a.target = "_blank"; a.rel = "noopener";
                }
                a.appendChild(el("span", "dot"));
                var txt = el("span", "txt");
                txt.appendChild(el("span", "t", l.title));
                if (l.note) txt.appendChild(el("span", "n", l.note));
                a.appendChild(txt);
                a.appendChild(el("span", "arrow", "→"));
                box.appendChild(a);
            });
        }
        fetch("links.json?cb=" + Date.now(), { cache: "no-store" })
            .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(function (doc) { render(doc && doc.links && doc.links.length ? doc : FALLBACK); })
            .catch(function () { render(FALLBACK); });
    })();
    </script>
</body>
</html>
